<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바텐톡 — 투자 소개</title>
<meta name="description" content="국내 최초 전국 단위 바텐더 전용 커뮤니티. 제품은 완성되어 있습니다.">
<meta name="robots" content="noindex">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&display=swap">
<style>
/* ============================================================
   바텐톡 투자 원페이지 — 위스키 바의 어두운 무드
   배경은 검정이 아니라 오크통 쪽으로 기운 갈색 근처 검정.
   앰버(위스키색) 하나만 힘을 주고 나머지는 전부 조용하게.
   ============================================================ */
:root {
  --bg: #0f0c09;
  --surface: #171310;
  --surface2: #1e1813;
  --line: #2b2219;
  --line-soft: #241d15;
  --ink: #ece3d4;
  --sub: #a5977f;
  --muted: #6f6353;
  --accent: #e0a94f;        /* UI 강조 (제목·버튼) */
  --accent-deep: #b98428;
  /* 차트 계열색 — 검증 통과 (다크 표면 대비 CVD ΔE 11.7 / 대비 3:1 이상) */
  --s1: #ba8426;            /* 브랜드 제휴 */
  --s2: #3fa98e;            /* 코디얼 유통 */
  --s3: #6b8de8;            /* 채용 매칭 */
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--ink);
  word-break: keep-all;   /* 한국어 단어 중간에서 줄이 꺾이지 않게 */
  font-family: "Pretendard Variable", Pretendard, -apple-system, "Noto Sans KR", sans-serif;
  line-height: 1.65; -webkit-font-smoothing: antialiased;
}
.serif { font-family: "Noto Serif KR", serif; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
section { padding: 88px 0; border-top: 1px solid var(--line-soft); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.eyebrow {
  font-size: 12.5px; font-weight: 700; letter-spacing: .22em;
  color: var(--accent); text-transform: uppercase; margin-bottom: 14px;
}
h2 {
  font-family: "Noto Serif KR", serif; font-weight: 700;
  font-size: clamp(24px, 3.6vw, 34px); line-height: 1.35;
  text-wrap: balance; margin-bottom: 14px;
}
.lede { color: var(--sub); font-size: 16.5px; max-width: 640px; margin-bottom: 40px; }

/* ---------- 히어로 ---------- */
.hero { border-top: 0; padding: 96px 0 84px; position: relative; overflow: hidden; }
.hero::before {  /* 잔 위에 떨어지는 조명 한 줄 */
  content: ""; position: absolute; top: -220px; left: 50%; transform: translateX(-62%);
  width: 720px; height: 480px; pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(224,169,79,.13), transparent 62%);
}
.hero-grid { display: flex; gap: 56px; align-items: center; flex-wrap: wrap; position: relative; }
.hero-copy { flex: 1 1 420px; min-width: 300px; }
.brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 34px; }
.brand-row img { width: 30px; height: 30px; border-radius: 8px; }
.brand-row b { font-size: 17px; letter-spacing: -.01em; }
.brand-row span { color: var(--muted); font-size: 12.5px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; }
h1 {
  font-family: "Noto Serif KR", serif; font-weight: 900;
  font-size: clamp(30px, 5vw, 46px); line-height: 1.32; letter-spacing: -.01em;
  text-wrap: balance; margin-bottom: 20px;
}
h1 em { font-style: normal; color: var(--accent); }
.hero-sub { color: var(--sub); font-size: 17px; max-width: 480px; margin-bottom: 34px; }
.cta-row { display: flex; gap: 12px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 13px 22px; border-radius: 12px; font-size: 15px; font-weight: 700;
  border: 1px solid var(--line); color: var(--ink); background: var(--surface);
  cursor: pointer; transition: transform .12s ease, background .12s ease;
}
.btn:hover { text-decoration: none; transform: translateY(-1px); background: var(--surface2); }
.btn.primary {
  background: linear-gradient(135deg, #e8b45c, #c08a2e);
  color: #241703; border: 0;
}
.hero-note { margin-top: 18px; font-size: 13px; color: var(--muted); }

/* 폰 목업 — 실제 앱의 홈을 단순화해 그린 것 */
.phone-slot { flex: 0 1 300px; margin: 0 auto; }
.phone {
  width: 272px; height: 556px; border-radius: 40px; padding: 10px;
  background: #060504; border: 1px solid #322a20;
  box-shadow: 0 40px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(224,169,79,.06);
  transform: rotate(-2.2deg);
}
.screen {
  width: 100%; height: 100%; border-radius: 31px; overflow: hidden;
  background: #fdf9f4; color: #1c1712; font-size: 11px;
  display: flex; flex-direction: column;
}
.m-top { display: flex; align-items: center; gap: 5px; padding: 14px 14px 8px; font-weight: 800; font-size: 14px; }
.m-drop { width: 13px; height: 13px; background: linear-gradient(135deg,#ff5c35,#ff8ad4); clip-path: path("M6.5 0 C6.5 0 12.6 6.4 12.6 9.4 A6.1 6.1 0 1 1 .4 9.4 C.4 6.4 6.5 0 6.5 0 Z"); }
.m-greet { padding: 4px 14px 10px; font-size: 12.5px; font-weight: 700; }
.m-greet small { display: block; font-weight: 500; color: #8b7f70; font-size: 10px; }
.m-quick { display: flex; gap: 6px; padding: 0 14px 10px; }
.m-quick i { flex: 1; height: 44px; border-radius: 10px; background: #f2ece4; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 15px; }
.m-post { margin: 0 14px 8px; padding: 9px 11px; border: 1px solid #eee5da; border-radius: 12px; background: #fff; }
.m-post b { display: block; font-size: 11px; margin-bottom: 2px; }
.m-post span { color: #97897a; font-size: 9.5px; }
.m-meta { display: flex; gap: 8px; margin-top: 5px; color: #b3a696; font-size: 9px; }
.m-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: -1px; }

/* ---------- 카드 공통 ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 26px 24px;
}
.card h3 { font-size: 17px; font-weight: 800; margin: 12px 0 8px; letter-spacing: -.01em; }
.card p { color: var(--sub); font-size: 14.5px; }
.card .num {
  font-family: "Noto Serif KR", serif; font-weight: 700; font-size: 15px;
  color: var(--muted); letter-spacing: .08em;
}
.tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; }

/* 시장 스탯 타일 */
.stat-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.stat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px 24px; }
.stat-tile .v { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
.stat-tile .l { color: var(--sub); font-size: 14px; }
.stat-tile .src { color: var(--muted); font-size: 12px; margin-top: 10px; }

/* ---------- 재무 모델 ---------- */
.disclaimer {
  display: flex; gap: 12px; align-items: flex-start;
  background: color-mix(in srgb, var(--accent) 8%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
  border-radius: 14px; padding: 15px 18px; margin-bottom: 30px;
  color: var(--ink); font-size: 14px; font-weight: 600;
}
.disclaimer small { display: block; font-weight: 500; color: var(--sub); margin-top: 3px; font-size: 12.5px; }

.model { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
@media (max-width: 860px) { .model { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
.panel h4 { font-size: 13px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; margin-bottom: 18px; }

.slider-row { margin-bottom: 20px; }
.slider-row label { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--sub); margin-bottom: 8px; }
.slider-row label b { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 14.5px; }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 22px; cursor: pointer; }

.assump { border-top: 1px solid var(--line-soft); padding-top: 16px; margin-top: 4px; }
.assump-title { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.assump-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--sub); margin-bottom: 8px; }
.assump-row input {
  width: 86px; padding: 6px 8px; text-align: right;
  background: var(--surface2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
  font: inherit; font-variant-numeric: tabular-nums;
}
.assump-row input:focus { outline: 1px solid var(--accent-deep); }

.formula {
  background: var(--surface2); border: 1px solid var(--line-soft); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 14px;
  font-size: 13.5px; color: var(--sub);
  font-variant-numeric: tabular-nums; overflow-x: auto; white-space: nowrap;
}
.formula b { color: var(--ink); font-weight: 700; }
.formula .k { display: inline-block; min-width: 86px; color: var(--muted); }
.formula .sw { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 7px; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { background: var(--surface2); border: 1px solid var(--line-soft); border-radius: 14px; padding: 16px 18px; }
.kpi .v { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* 시나리오 바 차트 */
.legend { display: flex; gap: 18px; flex-wrap: wrap; margin: 4px 0 14px; font-size: 13px; color: var(--sub); }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; font-style: normal; }
.scen { margin-bottom: 14px; }
.scen-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.scen-head .n { font-size: 13.5px; font-weight: 700; }
.scen-head .n small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.scen-head .t { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
.bar { display: flex; height: 26px; border-radius: 6px; overflow: visible; }
.seg {
  height: 100%; min-width: 3px; cursor: default;
  border-right: 2px solid var(--surface);   /* 조각 사이 2px 표면 간격 */
  transition: width .25s ease;
}
.seg:first-child { border-radius: 6px 0 0 6px; }
.seg:last-child { border-radius: 0 4px 4px 0; border-right: 0; }
.chart-wrap { position: relative; }
.tip {
  position: absolute; z-index: 5; pointer-events: none;
  background: #060504; border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 12px; font-size: 12.5px; color: var(--ink);
  transform: translate(-50%, -110%); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.tip small { color: var(--sub); display: block; }
details.tbl { margin-top: 16px; }
details.tbl summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details.tbl table { width: 100%; margin-top: 10px; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
details.tbl th, details.tbl td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--line-soft); }
details.tbl th:first-child, details.tbl td:first-child { text-align: left; }
details.tbl th { color: var(--muted); font-weight: 600; }

/* ---------- 연도별 계획 ---------- */
.yearchart { display: flex; align-items: flex-end; gap: 18px; height: 190px; margin: 8px 0 26px; }
.ybar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.ybar .amt { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ybar .col {
  width: 100%; max-width: 92px; border-radius: 6px 6px 0 0;
  background: var(--s1); min-height: 6px;
  transition: height .3s ease;
}
.ybar .yr { font-size: 13px; color: var(--muted); }
.plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.plan-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px 22px; }
.plan-card .yr { font-family: "Noto Serif KR", serif; font-weight: 700; font-size: 18px; color: var(--accent); }
.plan-card .theme { font-size: 13px; color: var(--muted); margin: 2px 0 14px; }
.plan-kv { display: flex; justify-content: space-between; font-size: 13.5px; padding: 6px 0; border-bottom: 1px solid var(--line-soft); }
.plan-kv span { color: var(--sub); }
.plan-kv b { font-variant-numeric: tabular-nums; }
.plan-card ul { list-style: none; margin-top: 12px; }
.plan-card li { font-size: 13.5px; color: var(--sub); padding: 4px 0 4px 18px; position: relative; }
.plan-card li::before { content: "—"; position: absolute; left: 0; color: var(--accent-deep); }
.plan-note { font-size: 13px; color: var(--muted); margin-top: 18px; }

/* ---------- 투자 요청 ---------- */
.ask { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.use-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--sub); padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.mile { display: flex; gap: 14px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
.mile b { color: var(--accent); font-family: "Noto Serif KR", serif; min-width: 46px; }
.mile span { color: var(--sub); }

/* ---------- 팀 ---------- */
.team { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.avatar {
  width: 46px; height: 46px; border-radius: 14px;
  background: linear-gradient(135deg, #e8b45c, #c08a2e);
  display: flex; align-items: center; justify-content: center;
  color: #241703; font-weight: 800; font-size: 18px;
}
footer { padding: 46px 0 64px; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: 12.5px; }
footer .wrap { display: flex; flex-direction: column; gap: 8px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .btn, .seg { transition: none; } }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
<script>
/* ============================================================
   React 단일 파일. 빌드 없이 그대로 열립니다.
   JSX 대신 htm(700바이트)을 써서 3MB짜리 바벨을 안 내려받아요.
   ============================================================ */
const { useState, useMemo, useEffect } = React;
const html = htm.bind(React.createElement);

/* 원화 표기: 2.4억 / 3,200만 */
const won = (v) => {
  if (!isFinite(v)) return "-";
  if (v >= 1e8) { const a = v / 1e8; return (a >= 10 ? Math.round(a) : a.toFixed(1).replace(/\.0$/, "")) + "억"; }
  if (v >= 1e4) return Math.round(v / 1e4).toLocaleString() + "만";
  return Math.round(v).toLocaleString();
};
const num = (v) => (+v || 0).toLocaleString();

const STREAMS = [
  { key: "brand",   name: "브랜드 제휴", color: "var(--s1)", hex: "#ba8426" },
  { key: "cordial", name: "코디얼 유통", color: "var(--s2)", hex: "#3fa98e" },
  { key: "hire",    name: "채용 매칭",   color: "var(--s3)", hex: "#6b8de8" },
];

/* 시나리오 — 참여율·전환율과 단가를 따로 흔듭니다.
   숫자는 배수라서 가정이 바뀌어도 의미가 유지돼요. */
const SCEN = [
  { key: "bear", name: "Bear", ko: "보수", rate: 0.6, price: 0.85 },
  { key: "base", name: "Base", ko: "기본", rate: 1.0, price: 1.0 },
  { key: "bull", name: "Bull", ko: "공격", rate: 1.4, price: 1.15 },
];

function Eyebrow({ children }) { return html`<div className="eyebrow">${children}</div>`; }

/* ---------- 재무 모델 ---------- */
function FinanceModel() {
  const [users, setUsers] = useState(3000);     // 가입 바텐더
  const [active, setActive] = useState(35);     // 월 활성률 %
  const [priceX, setPriceX] = useState(100);    // 객단가 배율 %

  /* 단가 가정 — 전부 수정할 수 있는 칸입니다. 사실이 아니라 가정. */
  const [seedWon, setSeedWon] = useState(3);    // 캠페인당 활성 1인 시딩 단가 (만원)
  const [campaigns, setCampaigns] = useState(6);// 연간 캠페인 수
  const [conv, setConv] = useState(12);         // 코디얼 연 구매 전환 %
  const [aov, setAov] = useState(5.5);          // 코디얼 연 객단가 (만원)
  const [postRate, setPostRate] = useState(4);  // 활성 100명당 월 공고 수
  const [fee, setFee] = useState(5);            // 공고당 이용료 (만원)

  const calc = (s) => {
    const act = users * (active / 100) * s.rate;
    const m = (priceX / 100) * s.price;
    const brand = act * (seedWon * 1e4) * campaigns * m;
    const cordial = act * (conv / 100) * s.rate * (aov * 1e4) * m;
    const hire = (act / 100) * postRate * (fee * 1e4) * 12 * m;
    return { act, brand, cordial, hire, total: brand + cordial + hire };
  };
  const R = useMemo(() => Object.fromEntries(SCEN.map((s) => [s.key, calc(s)])),
    [users, active, priceX, seedWon, campaigns, conv, aov, postRate, fee]);
  const max = R.bull.total || 1;

  const [tip, setTip] = useState(null);
  const showTip = (e, name, v, total) => {
    const box = e.currentTarget.closest(".chart-wrap").getBoundingClientRect();
    const r = e.currentTarget.getBoundingClientRect();
    setTip({ x: r.left - box.left + r.width / 2, y: r.top - box.top,
      name, v, pct: Math.round((v / total) * 100) });
  };

  /* 휠 스크롤이 슬라이더 위를 지나가며 가정을 바꿔버리는 것을 막습니다.
     투자자가 페이지를 내리다가 모델이 몰래 바뀌면 신뢰가 깨져요. */
  useEffect(() => {
    const stop = (e) => e.preventDefault();
    const els = document.querySelectorAll('input[type=range]');
    els.forEach((el) => el.addEventListener('wheel', stop, { passive: false }));
    return () => els.forEach((el) => el.removeEventListener('wheel', stop));
  }, []);

  const base = R.base;
  const Slider = (label, val, set, min, max2, step, fmt) => html`
    <div className="slider-row">
      <label><span>${label}</span><b>${fmt}</b></label>
      <input type="range" min=${min} max=${max2} step=${step} value=${val}
        aria-label=${label} onInput=${(e) => set(+e.target.value)} />
    </div>`;
  const Assump = (label, val, set, step) => html`
    <div className="assump-row"><span>${label}</span>
      <input type="number" value=${val} step=${step || 1} min="0"
        aria-label=${label} onInput=${(e) => set(+e.target.value || 0)} />
    </div>`;

  return html`
    <div className="disclaimer">
      <span aria-hidden="true">⚠️</span>
      <div>본 재무 전망은 아래 가정에 따른 추정치이며, 실제 실적을 보장하지 않습니다.
