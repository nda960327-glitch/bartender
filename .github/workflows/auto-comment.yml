# ============================================================
#  AI 자동 댓글 크론
#
#  publish-queue.yml 과 같은 이유로 GitHub Actions 를 씁니다.
#  Vercel Cron 은 Hobby 요금제에서 "하루 1회"만 되거든요.
#
#  준비물 — GitHub 저장소 > Settings
#    Secrets and variables > Actions > Secrets
#       CRON_SECRET       : Vercel 환경변수에 넣은 값과 똑같이
#    Secrets and variables > Actions > Variables   (선택)
#       AUTO_COMMENT_URL  : 기본값은 https://barapp.kr/api/auto-comment
#
#  ⚠️ 자주 부른다고 댓글이 자주 달리지 않습니다.
#     실제로 달지 말지는 DB 가 정해요 — 스위치 · 쉬는 시간 ·
#     10분/60분/24시간 구간 상한 · 매번 굴리는 확률.
#     여기는 그냥 노크만 합니다.
#
#  서버에 ANTHROPIC_API_KEY 가 없으면 조용히 아무것도 안 하고
#  정상 응답(reason: no_api_key)이 옵니다. 실패로 잡히지 않아요.
# ============================================================
name: AI 자동 댓글

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# 앞 실행이 아직 안 끝났으면 겹쳐 돌리지 않습니다.
concurrency:
  group: auto-comment
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 자동 댓글 엔드포인트 호출
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AUTO_COMMENT_URL: ${{ vars.AUTO_COMMENT_URL }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          URL="${AUTO_COMMENT_URL:-https://barapp.kr/api/auto-comment}"

          BODY=$(mktemp)
          CODE=$(curl -sS -m 60 -o "$BODY" -w '%{http_code}' \
                   -H "x-cron-key: ${CRON_SECRET}" \
                   "${URL}")

          echo "HTTP ${CODE}"
          cat "$BODY"
          echo

          if [ "$CODE" != "200" ]; then
            echo "::error::자동 댓글 요청이 실패했습니다 (HTTP ${CODE})"
            exit 1
          fi

          # 달렸는지 아닌지를 실행 목록에 한 줄로 남깁니다.
          # (파이썬을 쓰지 않습니다 — 셸만으로 되는 일이라)
          jsonval() { sed -n "s/.*\"$1\":\"\\([^\"]*\\)\".*/\\1/p" "$BODY"; }

          if grep -q '"posted":true' "$BODY"; then
            NICK=$(jsonval nick)
            POST=$(sed -n 's/.*"post_id":\([0-9]*\).*/\1/p' "$BODY")
            echo "댓글 1개 — ${NICK:-?} → 글 #${POST:-?}" >> "$GITHUB_STEP_SUMMARY"
          else
            REASON=$(jsonval reason)
            case "${REASON}" in
              no_target)        WHY="달 곳 없음 (꺼짐·쉬는 시간·상한·주사위)" ;;
              no_api_key)       WHY="API 키 없음 (OPENAI_API_KEY 또는 ANTHROPIC_API_KEY) — 건너뜀" ;;
              bad_api_key)      WHY="API 키가 거부됨 — 키를 다시 확인하세요" ;;
              model_error)      WHY="모델 호출 실패 — Vercel 로그를 보세요" ;;
              model_skipped)    WHY="쓸 말이 마땅치 않아 건너뜀" ;;
              refusal)          WHY="모델이 거절" ;;
              duplicate)        WHY="이미 달려 있음" ;;
              too_long)         WHY="너무 길어서 버림" ;;
              bad_model_output) WHY="응답을 해석하지 못함" ;;
              *)                WHY="${REASON:-알 수 없음}" ;;
            esac
            echo "안 달림 — ${WHY}" >> "$GITHUB_STEP_SUMMARY"
          fi
